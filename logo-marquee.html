<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Looping Logo Strip</title>
  <style>
    :root {
      color-scheme: light;
      --tile-width: clamp(132px, 8.34vw, 160px);
      --strip-height: 90px;
      --rule: #eeeeee;
      --ink: #050505;
      --speed: 18s;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: #fff;
    }

    body {
      display: grid;
      align-content: start;
      padding: 0 12px;
      font-family: Arial, Helvetica, sans-serif;
    }

    .logo-strip {
      width: 100%;
      height: var(--strip-height);
      overflow: hidden;
      border-bottom: 1px solid var(--rule);
      background: #fff;
      -webkit-mask-image: linear-gradient(to right, transparent, #000 9px, #000 calc(100% - 9px), transparent);
      mask-image: linear-gradient(to right, transparent, #000 9px, #000 calc(100% - 9px), transparent);
    }

    .track {
      display: flex;
      width: max-content;
      height: 100%;
      animation: scroll-left var(--speed) linear infinite;
      will-change: transform;
    }

    .logo-group {
      display: flex;
      flex: 0 0 auto;
      height: 100%;
    }

    .logo-cell {
      display: grid;
      flex: 0 0 var(--tile-width);
      height: 100%;
      place-items: center;
      border-left: 1px solid var(--rule);
    }

    .logo-cell:last-child { border-right: 1px solid var(--rule); }

    .logo {
      display: block;
      width: 32px;
      height: 32px;
      color: var(--ink);
    }

    @keyframes scroll-left {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
    }

    @media (prefers-reduced-motion: reduce) {
      .track { animation-duration: 70s; }
    }
  </style>
</head>
<body>
  <main class="logo-strip" aria-label="A continuously scrolling row of logos">
    <div class="track" id="track">
      <div class="logo-group" aria-hidden="true">
        <!-- Original abstract marks, drawn inline so this file has no dependencies. -->
        <div class="logo-cell">
          <svg class="logo" viewBox="0 0 40 40" aria-hidden="true">
            <path fill="currentColor" d="M20 4a16 16 0 1 0 16 16A16 16 0 0 0 20 4Zm0 6a10 10 0 0 1 9.7 7.6H19a2 2 0 0 1-2-2v-5.2A10 10 0 0 1 20 10Zm-2 20.8V25a2 2 0 0 1 2-2h10.7A10 10 0 0 1 18 30.8Z"/>
          </svg>
        </div>
        <div class="logo-cell">
          <svg class="logo" viewBox="0 0 40 40" aria-hidden="true">
            <path d="M4 24.5 15.5 13a7 7 0 0 1 9.9 0l1.1 1.1m9.5 1.4L24.5 27a7 7 0 0 1-9.9 0l-1.1-1.1m-2.2-2.2 17.4-7.4M11 22.2l18-7.5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="4.2"/>
          </svg>
        </div>
        <div class="logo-cell">
          <svg class="logo" viewBox="0 0 40 40" aria-hidden="true">
            <path fill="currentColor" d="M7 5h26v13c0 9-5.3 14.8-13 18C12.3 32.8 7 27 7 18V5Zm5 5v8c0 5.7 2.8 9.4 8 12 5.2-2.6 8-6.3 8-12v-8H12Z"/>
            <path d="M20 11v16M12 18h16" stroke="#fff" stroke-width="2.3"/>
            <circle cx="20" cy="18" r="3.2" fill="#fff"/>
          </svg>
        </div>
        <div class="logo-cell">
          <svg class="logo" viewBox="0 0 40 40" aria-hidden="true">
            <rect x="3" y="4" width="15" height="15" rx="7.5" fill="currentColor"/>
            <rect x="22" y="4" width="15" height="15" rx="7.5" fill="currentColor"/>
            <rect x="3" y="21" width="15" height="15" rx="7.5" fill="currentColor"/>
            <rect x="22" y="21" width="15" height="15" rx="7.5" fill="currentColor"/>
          </svg>
        </div>
      </div>
      <div class="logo-group" aria-hidden="true">
        <div class="logo-cell"><svg class="logo" viewBox="0 0 40 40"><path fill="currentColor" d="M20 4a16 16 0 1 0 16 16A16 16 0 0 0 20 4Zm0 6a10 10 0 0 1 9.7 7.6H19a2 2 0 0 1-2-2v-5.2A10 10 0 0 1 20 10Zm-2 20.8V25a2 2 0 0 1 2-2h10.7A10 10 0 0 1 18 30.8Z"/></svg></div>
        <div class="logo-cell"><svg class="logo" viewBox="0 0 40 40"><path d="M4 24.5 15.5 13a7 7 0 0 1 9.9 0l1.1 1.1m9.5 1.4L24.5 27a7 7 0 0 1-9.9 0l-1.1-1.1m-2.2-2.2 17.4-7.4M11 22.2l18-7.5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="4.2"/></svg></div>
        <div class="logo-cell"><svg class="logo" viewBox="0 0 40 40"><path fill="currentColor" d="M7 5h26v13c0 9-5.3 14.8-13 18C12.3 32.8 7 27 7 18V5Zm5 5v8c0 5.7 2.8 9.4 8 12 5.2-2.6 8-6.3 8-12v-8H12Z"/><path d="M20 11v16M12 18h16" stroke="#fff" stroke-width="2.3"/><circle cx="20" cy="18" r="3.2" fill="#fff"/></svg></div>
        <div class="logo-cell"><svg class="logo" viewBox="0 0 40 40"><rect x="3" y="4" width="15" height="15" rx="7.5" fill="currentColor"/><rect x="22" y="4" width="15" height="15" rx="7.5" fill="currentColor"/><rect x="3" y="21" width="15" height="15" rx="7.5" fill="currentColor"/><rect x="22" y="21" width="15" height="15" rx="7.5" fill="currentColor"/></svg></div>
      </div>
    </div>
  </main>
  <script>
    // Keep the duplicate logo run in sync if the tile width is changed in CSS.
    const track = document.getElementById('track');
    const firstGroup = track.querySelector('.logo-group');
    const secondGroup = firstGroup.cloneNode(true);
    secondGroup.setAttribute('aria-hidden', 'true');
    track.replaceChild(secondGroup, track.children[1]);
  </script>
</body>
</html>
